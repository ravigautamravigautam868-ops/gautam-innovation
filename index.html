<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gautam Innovations | Linktree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --hover-color: #1f6feb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .handle {
            font-size: 0.95rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 500;
        }
        .bio {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #8b949e;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .link-btn {
            background-color: var(--card-bg);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .link-btn:hover {
            background-color: var(--hover-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 40px;
        }
        .social-icons a {
            color: #8b949e;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }
        .social-icons a:hover {
            color: var(--accent-color);
        }
        footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="profile-img" src="https://via.placeholder.com/150" alt="Gautam Innovations Logo">
        <h1>Gautam Innovations</h1>
        <div class="handle">@Gautam_Innovations</div>
        <p class="bio">Shaping the Future Through Innovation<br>⚙️ Mechanical Engineer | Designer | Innovator ⚙️</p>
        <div class="links-container">
            <a href="#" target="_blank" class="link-btn"><i class="fa-solid fa-briefcase"></i> View My Portfolio</a>
            <a href="#" target="_blank" class="link-btn"><i class="fa-solid fa-gears"></i> ESI Simulation Projects</a>
            <a href="#" target="_blank" class="link-btn"><i class="fa-solid fa-file-arrow-down"></i> Download Resume / CV</a>
            <a href="mailto:gautaminnovations@gmail.com" class="link-btn"><i class="fa-solid fa-envelope"></i> Contact For Collaboration</a>
        </div>
        <div class="social-icons">
            <a href="https://linkedin.com/" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            <a href="https://instagram.com/Gautam_Innovations" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <footer>&copy; 2026 Gautam Innovations. All Rights Reserved.</footer>
    </div>
</body>
</html>
